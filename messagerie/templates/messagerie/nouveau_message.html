{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Nouveau message | Messagerie</title>


    <!-- Google Font -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">


    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="{% static 'base/plugins/fontawesome-free/css/all.min.css' %}">


    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="{% static 'base/plugins/bootstrap/css/bootstrap.min.css' %}">


    <!-- AdminLTE -->
    <link rel="stylesheet"
          href="{% static 'base/css/adminlte.min.css' %}">


    <style>

        body {
            background-color: #f4f6f9;
        }

        .content-wrapper {
            min-height: calc(100vh - 57px);
            margin-left: 0 !important;
        }

        .messagerie-card {
            border-radius: 10px;
            overflow: hidden;
        }

        .form-control {
            border-radius: 6px;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.1rem rgba(0,123,255,.15);
        }

        textarea.form-control {
            min-height: 180px;
            resize: vertical;
        }

        .btn-envoyer {
            font-weight: 600;
        }

        .navbar-brand {
            font-weight: 600;
        }

    </style>

</head>


<body class="hold-transition">


<div class="wrapper">


    <!-- NAVBAR -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">

        <ul class="navbar-nav">

            <li class="nav-item">

                <a class="nav-link"
                   href="{% url 'boite_reception' %}"
                   title="Retour à la boîte de réception">

                    <i class="fas fa-arrow-left"></i>

                </a>

            </li>

        </ul>


        <span class="navbar-brand mb-0 h1 ml-2">

            <i class="fas fa-envelope mr-2"></i>

            Messagerie

        </span>


        <ul class="navbar-nav ml-auto">

            <li class="nav-item">

                <a class="nav-link"
                   href="{% url 'boite_reception' %}"
                   title="Boîte de réception">

                    <i class="fas fa-inbox"></i>

                </a>

            </li>

        </ul>

    </nav>



    <!-- CONTENT WRAPPER -->
    <div class="content-wrapper">


        <!-- HEADER -->
        <section class="content-header">

            <div class="container-fluid">

                <div class="row mb-2">


                    <div class="col-sm-6">

                        <h1>

                            <i class="fas fa-pen mr-2"></i>

                            Nouveau message

                        </h1>

                    </div>


                    <div class="col-sm-6">

                        <ol class="breadcrumb float-sm-right">


                            <li class="breadcrumb-item">

                                <a href="{% url 'fondateur.dashbord' %}">

                                    Accueil

                                </a>

                            </li>


                            <li class="breadcrumb-item">

                                <a href="{% url 'boite_reception' %}">

                                    Messagerie

                                </a>

                            </li>


                            <li class="breadcrumb-item active">

                                Nouveau message

                            </li>


                        </ol>

                    </div>


                </div>

            </div>

        </section>



        <!-- CONTENT -->
        <section class="content">

            <div class="container-fluid">


                <!-- MESSAGES DJANGO -->
                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">

                            {{ message }}


                            <button type="button"
                                    class="close"
                                    data-dismiss="alert">

                                <span>&times;</span>

                            </button>

                        </div>

                    {% endfor %}

                {% endif %}



                <!-- CARD -->
                <div class="card card-primary card-outline messagerie-card">


                    <!-- CARD HEADER -->
                    <div class="card-header">

                        <h3 class="card-title">

                            <i class="fas fa-envelope mr-2"></i>

                            Rédiger un message

                        </h3>

                    </div>



                    <!-- FORMULAIRE -->
                    <form method="post">

                        {% csrf_token %}


                        <div class="card-body">


                            <!-- DESTINATAIRE -->
                            <div class="form-group">

                                <label for="destinataire">

                                    <i class="fas fa-user mr-1"></i>

                                    Destinataire

                                </label>


                                <select name="destinataire"
                                        id="destinataire"
                                        class="form-control"
                                        required>


                                    <option value="">

                                        -- Sélectionner un destinataire --

                                    </option>


                                    {% for utilisateur in utilisateurs %}

                                        <option value="{{ utilisateur.id }}">

                                            {{ utilisateur.username }}

                                            {% if utilisateur.get_full_name %}

                                                — {{ utilisateur.get_full_name }}

                                            {% endif %}

                                        </option>

                                    {% endfor %}


                                </select>

                            </div>



                            <!-- OBJET -->
                            <div class="form-group">

                                <label for="objet">

                                    <i class="fas fa-heading mr-1"></i>

                                    Objet

                                </label>


                                <input type="text"
                                       name="objet"
                                       id="objet"
                                       class="form-control"
                                       maxlength="255"
                                       placeholder="Objet du message"
                                       required>

                            </div>



                            <!-- MESSAGE -->
                            <div class="form-group">

                                <label for="contenu">

                                    <i class="fas fa-align-left mr-1"></i>

                                    Message

                                </label>


                                <textarea name="contenu"
                                          id="contenu"
                                          class="form-control"
                                          rows="8"
                                          placeholder="Écrivez votre message..."
                                          required></textarea>

                            </div>


                        </div>



                        <!-- FOOTER -->
                        <div class="card-footer d-flex justify-content-between">


                            <a href="{% url 'boite_reception' %}"
                               class="btn btn-secondary">

                                <i class="fas fa-times mr-1"></i>

                                Annuler

                            </a>


                            <button type="submit"
                                    class="btn btn-primary btn-envoyer">

                                <i class="fas fa-paper-plane mr-1"></i>

                                Envoyer

                            </button>


                        </div>


                    </form>


                </div>


            </div>

        </section>


    </div>



    <!-- FOOTER -->
    <footer class="main-footer text-center">

        <strong>

            Messagerie

        </strong>

        <span class="ml-2">

            — Nouveau message

        </span>

    </footer>


</div>



<!-- jQuery -->
<script src="{% static 'base/plugins/jquery/jquery.min.js' %}"></script>


<!-- Bootstrap -->
<script src="{% static 'base/plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>


<!-- AdminLTE -->
<script src="{% static 'base/js/adminlte.min.js' %}"></script>


</body>

</html>
