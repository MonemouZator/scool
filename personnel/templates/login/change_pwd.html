{% extends "login/index.html" %}
{% load static %}

{% block content_wrapper %}
<div class="container mx-4 row justify-content-center text-center mt-4">
  <div class="login-box">
    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Changer votre mot de passe ici</p>

        <form action="" method="post" id="frm">
          {% csrf_token %}
          
          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          {% if success %}
            <div class="alert alert-success">{{ success }}</div>
          {% endif %}

          <p class="text-danger" id="msg-error" style="display:none;"></p>

          <div class="input-group mb-3">
            <input type="password" class="form-control" placeholder="Mot de passe" name="password" required id="pwd">
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-lock"></span>
              </div>
            </div>
          </div>
          <div class="input-group mb-3">
            <input type="password" class="form-control" placeholder="Confirmer ..." name="confirm_password" required id="cpwd">
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-lock"></span>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-block">Changer</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block script_fils %}
<script>
  const frm = document.getElementById('frm');
  const pwd = document.getElementById('pwd');
  const cpwd = document.getElementById('cpwd');
  const errorMsg = document.getElementById('msg-error');

  frm.addEventListener('submit', function(e) {
    let valid = true;

    if (pwd.value !== cpwd.value) {
      valid = false;
      errorMsg.textContent = "Les mots de passe ne sont pas identiques";
      errorMsg.style.display = "block";
    }

    if (!valid) {
      e.preventDefault();
    }
  });
</script>
{% endblock %}
