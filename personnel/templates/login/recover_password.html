{% extends "login/index.html" %}

{% load static %}

{% block content_wrapper %}
<div class="container mx-4 row justify-content-center text-center mt-4">
<div class="login-box">
  <div class="login-logo">
    
  </div>
  <!-- /.login-logo -->
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Changer votre mot de passe ici</p>

      <form action="" method="post" id="frm">
        {% csrf_token %}
        <p class="text-danger" id="msg-error" style="display:none;"></p> <!-- On cache initialement le message -->
        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Mot de passe" name="password" required id="pwd">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Confirmer ..." required id="cpwd">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
            
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block">Changer</button>
          </div>
          <!-- /.col -->
        </div>

      </form>
     
    </div>
    <!-- /.login-card-body -->
  </div>
</div>
<!-- /.login-box -->
</div>
{% endblock %}

{% block script_fils %}
<script>
  
        let frm = document.getElementById('frm');
        let pwd = document.getElementById('pwd');
        let cpwd = document.getElementById('cpwd');
       

        // Vérification lors de la soumission du formulaire
        frm.addEventListener('submit',(e)=>{
          valid=true;

            // Vérifier que les mots de passe sont identiques avant soumission
            if (pwd.value !== cpwd.value) {
                valid=false;
                document.getElementById('msg-error').textContent="Les mots de passes ne sont pas indentiques"
            }
             if (!valid){
                e.preventDefault();
                

             }

        });

</script>
{% endblock %}
